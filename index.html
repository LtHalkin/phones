<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iPhone Flip Tracker</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --text:#1c1c1e; --muted:#6b7280; --line:#e5e7eb;
    --accent:#0a84ff; --good:#16a34a; --bad:#dc2626; --warn:#d97706;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#0f1115; --card:#1a1d24; --text:#f2f2f7; --muted:#9ca3af; --line:#2a2e38; }
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);padding:16px}
  .wrap{max-width:1000px;margin:0 auto}
  h1{margin:8px 0 16px;font-size:1.6rem}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:16px}
  .stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
  .stat .l{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .stat .v{font-size:1.4rem;font-weight:700;margin-top:4px}
  .stat.cash{border-color:var(--accent)}
  .stat input{margin-top:4px;padding:6px 8px;font-size:1.1rem;font-weight:700}
  form{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
  label{display:flex;flex-direction:column;font-size:.8rem;color:var(--muted);gap:4px}
  input,select{padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:1rem;width:100%}
  input:focus,select:focus{outline:2px solid var(--accent);border-color:transparent}
  .actions{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap}
  button{padding:10px 16px;border:0;border-radius:10px;font-size:.95rem;cursor:pointer;background:var(--accent);color:#fff;font-weight:600}
  button.sec{background:var(--line);color:var(--text)}
  button.sm{padding:5px 10px;font-size:.8rem}
  button.del{background:var(--bad)}
  .preview{grid-column:1/-1;font-size:.9rem;color:var(--muted)}
  .tablewrap{overflow-x:auto}
  table{width:100%;border-collapse:collapse;font-size:.9rem}
  th,td{padding:10px 8px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
  th{font-size:.72rem;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;cursor:pointer;user-select:none}
  .pos{color:var(--good);font-weight:600}.neg{color:var(--bad);font-weight:600}
  .tag{display:inline-block;padding:2px 8px;border-radius:99px;font-size:.72rem;font-weight:600}
  .tag.sold{background:rgba(22,163,74,.15);color:var(--good)}
  .tag.stock{background:rgba(217,119,6,.15);color:var(--warn)}
  .tag.cat{background:rgba(10,132,255,.15);color:var(--accent)}
  .empty{text-align:center;color:var(--muted);padding:24px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin-bottom:10px}
  .row input{max-width:240px}
  .cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px;font-size:.85rem;color:var(--muted)}
  .cats span{background:var(--bg);border:1px solid var(--line);border-radius:99px;padding:3px 10px}
</style>
</head>
<body>
<div class="wrap">
  <h1>📱 iPhone Flip Tracker</h1>

  <div class="stats">
    <span id="cashStat" style="display:contents"></span>
    <div class="stat">
      <div class="l">Starting cash (€)</div>
      <input type="number" step="0.01" id="startCash" placeholder="0">
    </div>
    <span id="stats" style="display:contents"></span>
  </div>

  <div class="card">
    <h3 id="formTitle" style="margin-top:0">Add an iPhone</h3>
    <form id="form">
      <label>iPhone model
        <input list="models" id="model" placeholder="e.g. iPhone 14 Pro" required>
        <datalist id="models"></datalist>
      </label>
      <label>Storage
        <select id="storage">
          <option>64GB</option><option>128GB</option><option selected>256GB</option>
          <option>512GB</option><option>1TB</option><option>Other</option>
        </select>
      </label>
      <label>Condition
        <select id="condition">
          <option>New</option><option>Excellent</option><option selected>Good</option>
          <option>Fair</option><option>Cracked / Faulty</option>
        </select>
      </label>
      <label>Where I bought it
        <input id="source" placeholder="e.g. Facebook Marketplace, DoneDeal" required>
      </label>
      <label>Date bought
        <input type="date" id="dateBought" required>
      </label>
      <label>Bought for (€)
        <input type="number" step="0.01" min="0" id="buyPrice" required>
      </label>
      <label>List price (€)
        <input type="number" step="0.01" min="0" id="listPrice">
      </label>
      <label>Where I sold it
        <input id="soldWhere" placeholder="Leave blank if unsold">
      </label>
      <label>Date sold
        <input type="date" id="dateSold">
      </label>
      <label>Sold for (€)
        <input type="number" step="0.01" min="0" id="soldPrice">
      </label>
      <label>Extra costs (€) <span style="font-weight:400">(repairs, postage, fees for this phone)</span>
        <input type="number" step="0.01" min="0" id="extra" value="0">
      </label>
      <div class="preview" id="preview"></div>
      <div class="actions">
        <button type="submit" id="saveBtn">Save phone</button>
        <button type="button" class="sec" id="cancelBtn" style="display:none">Cancel edit</button>
      </div>
    </form>
  </div>

  <div class="card">
    <div class="row">
      <input id="search" placeholder="Search model, source…">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="sec sm" id="exportCsv">Export CSV</button>
        <button class="sec sm" id="exportJson">Backup JSON</button>
        <button class="sec sm" id="importBtn">Import JSON</button>
        <input type="file" id="importFile" accept=".json" style="display:none">
      </div>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr>
          <th data-k="model">Phone</th>
          <th data-k="source">Bought at</th>
          <th data-k="buyPrice">Paid</th>
          <th data-k="listPrice">Listed</th>
          <th data-k="soldPrice">Sold for</th>
          <th data-k="days">Days to sell</th>
          <th data-k="profit">Profit</th>
          <th data-k="status">Status</th>
          <th></th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>

  <div class="card">
    <h3 style="margin-top:0">💸 Expenses</h3>
    <p style="margin-top:-6px;color:var(--muted);font-size:.85rem">General business costs not tied to one phone. These come off your cash on hand and your net profit.</p>
    <form id="expForm">
      <label>What was it for
        <input id="expDesc" placeholder="e.g. Petrol to pick up a phone" required>
      </label>
      <label>Category
        <input list="expCats" id="expCat" placeholder="e.g. Fuel">
        <datalist id="expCats">
          <option value="Fuel"><option value="Packaging"><option value="Postage"><option value="Tools & parts">
          <option value="Subscriptions"><option value="Fees"><option value="Other">
        </datalist>
      </label>
      <label>Date
        <input type="date" id="expDate" required>
      </label>
      <label>Amount (€)
        <input type="number" step="0.01" min="0" id="expAmt" required>
      </label>
      <div class="actions">
        <button type="submit">Add expense</button>
      </div>
    </form>
    <div class="cats" id="expCatTotals"></div>
    <div class="tablewrap" style="margin-top:8px">
      <table>
        <thead><tr>
          <th style="cursor:default">Date</th>
          <th style="cursor:default">Description</th>
          <th style="cursor:default">Category</th>
          <th style="cursor:default">Amount</th>
          <th></th>
        </tr></thead>
        <tbody id="expBody"></tbody>
      </table>
    </div>
  </div>
</div>

<script>
const KEY = "iphone-flip-tracker-v1";
const CASH_KEY = "iphone-flip-tracker-startcash";
const EXP_KEY = "iphone-flip-tracker-expenses";
const MODELS = ["iPhone 11","iPhone 11 Pro","iPhone 11 Pro Max","iPhone 12 mini","iPhone 12","iPhone 12 Pro","iPhone 12 Pro Max","iPhone 13 mini","iPhone 13","iPhone 13 Pro","iPhone 13 Pro Max","iPhone 14","iPhone 14 Plus","iPhone 14 Pro","iPhone 14 Pro Max","iPhone 15","iPhone 15 Plus","iPhone 15 Pro","iPhone 15 Pro Max","iPhone 16","iPhone 16 Plus","iPhone 16 Pro","iPhone 16 Pro Max","iPhone SE (2nd gen)","iPhone SE (3rd gen)","iPhone XR","iPhone XS","iPhone XS Max"];

let items = [];
try { items = JSON.parse(localStorage.getItem(KEY)) || []; } catch(e){ items = []; }
let expenses = [];
try { expenses = JSON.parse(localStorage.getItem(EXP_KEY)) || []; } catch(e){ expenses = []; }
let startCash = 0;
try { startCash = parseFloat(localStorage.getItem(CASH_KEY)) || 0; } catch(e){ startCash = 0; }
let editId = null, sortKey = "date", sortDir = -1;

const $ = id => document.getElementById(id);
const eur = n => (n === null || n === undefined || isNaN(n)) ? "—" : "€" + Number(n).toLocaleString("en-IE",{minimumFractionDigits:0,maximumFractionDigits:2});
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(items)); }catch(e){} };
const saveExp = () => { try{ localStorage.setItem(EXP_KEY, JSON.stringify(expenses)); }catch(e){} };

$("models").innerHTML = MODELS.map(m => `<option value="${m}">`).join("");
$("dateBought").valueAsDate = new Date();
$("expDate").valueAsDate = new Date();
$("startCash").value = startCash || "";
$("startCash").addEventListener("input", () => {
  startCash = parseFloat($("startCash").value) || 0;
  try{ localStorage.setItem(CASH_KEY, String(startCash)); }catch(e){}
  render();
});

function daysBetween(a,b){
  if(!a||!b) return null;
  return Math.round((new Date(b)-new Date(a))/86400000);
}
function calc(i){
  const sold = i.soldPrice !== null && i.soldPrice !== "" && i.soldPrice !== undefined && i.dateSold;
  const days = sold ? daysBetween(i.dateBought, i.dateSold) : null;
  const profit = sold ? (i.soldPrice - i.buyPrice - (i.extra||0)) : null;
  return {sold:!!sold, days, profit};
}

function preview(){
  const buy = parseFloat($("buyPrice").value), sp = parseFloat($("soldPrice").value), ex = parseFloat($("extra").value)||0;
  const d = daysBetween($("dateBought").value, $("dateSold").value);
  let t = "";
  if(!isNaN(buy) && !isNaN(sp)){
    const p = sp-buy-ex;
    t += `Profit: <b class="${p>=0?'pos':'neg'}">${eur(p)}</b> (${(p/buy*100).toFixed(1)}% return)`;
  }
  if(d !== null) t += (t?" · ":"") + `Took <b>${d}</b> day${d===1?"":"s"} to sell`;
  $("preview").innerHTML = t;
}
["buyPrice","soldPrice","extra","dateBought","dateSold"].forEach(id => $(id).addEventListener("input", preview));

$("form").addEventListener("submit", e => {
  e.preventDefault();
  const num = id => $(id).value === "" ? null : parseFloat($(id).value);
  const rec = {
    id: editId || Date.now().toString(36),
    model: $("model").value.trim(),
    storage: $("storage").value,
    condition: $("condition").value,
    source: $("source").value.trim(),
    dateBought: $("dateBought").value,
    buyPrice: num("buyPrice"),
    listPrice: num("listPrice"),
    soldWhere: $("soldWhere").value.trim(),
    dateSold: $("dateSold").value,
    soldPrice: num("soldPrice"),
    extra: num("extra") || 0
  };
  if(editId){ items = items.map(i => i.id===editId ? rec : i); }
  else items.push(rec);
  save(); resetForm(); render();
});

function resetForm(){
  editId = null;
  $("form").reset();
